name: Build sea data

# Run by hand: Actions tab -> "Build sea data" -> "Run workflow".
# Downloads open land, depth and fairway data, builds the files in sea/ and commits them.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: pip install numpy requests shapely pyogrio pyproj rasterio

      - name: Download OpenStreetMap land polygons
        run: |
          curl -L --fail --retry 3 -o land-polygons-split-4326.zip \
            https://osmdata.openstreetmap.de/download/land-polygons-split-4326.zip
          ls -lh land-polygons-split-4326.zip

      - name: Build sea data
        run: |
          python tools/build_sea_data.py \
            --land /vsizip/land-polygons-split-4326.zip/land-polygons-split-4326/land_polygons.shp \
            --out sea

      - name: Commit sea data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sea
          git commit -m "Update sea data $(date -u +%Y-%m-%d)" || echo "No changes"
          git push
